<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de películas</title>
</head>
<body>
    <h1>Gestión de películas</h1>

    <div id="formulario">
        <form id="crearpelicula">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" name="titulo">

            <label for="duracion">Duración (min)</label>
            <input type="number" id="duracion" name="duracion" min="0">

            <label for="fecha">Fecha de estreno</label>
            <input type="date" id="fecha" name="fecha">

            <label for="generos">Géneros (separados por comas)</label>
            <input type="text" id="generos" name="generos">

            <button type="submit">Añadir</button>
        </form>
    </div>

    <div id="total"></div>

    <div id="peliculas"></div>

    <script type="module" src="js/gestionPeliculasWeb.js"></script>
</body>
</html>
